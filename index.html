<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Memories">
<link rel="manifest" href="./manifest.webmanifest">
<title>Classic Memories</title>
<style>
:root{--bg:#000;--line:#2a2a2a;--text:#fff;--muted:#8c8c8c;--gap:7px;--r:10px}
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Helvetica,Arial,sans-serif}
.app{max-width:900px;margin:auto;padding:calc(env(safe-area-inset-top) + 12px) 10px calc(env(safe-area-inset-bottom) + 36px)}
.panel{position:sticky;top:0;z-index:20;background:rgba(0,0,0,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);margin:0 -10px 14px;padding:10px;border-bottom:1px solid rgba(255,255,255,.08)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
input[type=text]{width:100%;min-width:0;border:1px solid var(--line);background:#151515;color:#fff;border-radius:10px;padding:11px 12px;font-size:16px;outline:none}
button,.pick{border:0;border-radius:10px;padding:11px 12px;font-size:15px;font-weight:650;text-align:center;background:#f2f2f2;color:#111}
button.secondary{background:#171717;color:#fff;border:1px solid #303030}
button.danger{background:#291313;color:#fff;border:1px solid #5b2424}
button:disabled{opacity:.4}.pick input{display:none}
.status{font-size:12px;color:var(--muted);line-height:1.45;margin-top:2px}
.progress{height:4px;background:#1b1b1b;border-radius:999px;overflow:hidden;margin-top:8px;display:none}.progress>div{height:100%;width:0;background:#fff}
.titlewrap{text-align:center;padding:10px 0 18px}.title{font-size:20px;font-weight:700;line-height:1.05}.year{font-size:16px;font-weight:500;color:#d6d6d6;margin-top:3px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap)}
.tile{aspect-ratio:3/4;border-radius:var(--r);overflow:hidden;background:#111;position:relative}
.tile img{width:100%;height:100%;display:block;object-fit:cover}
.controls{position:absolute;top:5px;right:5px;z-index:2}.iconbtn{width:28px;height:28px;border-radius:999px;padding:0;background:rgba(0,0,0,.72);color:#fff;border:1px solid rgba(255,255,255,.22);font-size:15px;line-height:28px}
.movebar{display:flex;gap:4px;position:absolute;left:5px;bottom:5px}.movebar .iconbtn{font-size:13px}
.empty{min-height:48vh;display:grid;place-items:center;text-align:center;color:#777;padding:32px;font-size:15px;line-height:1.55}.note{text-align:center;color:#626262;font-size:12px;margin-top:20px}.count{font-weight:650;color:#fff}
</style>
</head>
<body>
<div class="app">
  <div class="panel">
    <div class="row"><input id="title" type="text" value="Summer"><input id="year" type="text" value="2025"></div>
    <div class="row"><label class="pick">Add Photos<input id="picker" type="file" accept="image/*,.heic,.heif" multiple></label><button id="export" disabled>Export PNG</button></div>
    <div class="row" style="margin-bottom:0"><button id="reverse" class="secondary" disabled>Reverse order</button><button id="clear" class="danger" disabled>Clear all</button></div>
    <div id="status" class="status">Add photos anytime. New selections are appended.</div><div id="prog" class="progress"><div id="bar"></div></div>
  </div>
  <div class="titlewrap"><div id="titleView" class="title">Summer</div><div id="yearView" class="year">2025</div></div>
  <div id="empty" class="empty">Add your first batch of photos.<br><br>You can keep adding more, remove individual photos, or change their order without starting over.</div>
  <div id="grid" class="grid" hidden></div>
  <div class="note">Classic aligned 3-column layout · photos are gently cropped to a consistent 3:4 frame</div>
</div>
<script>
const $=id=>document.getElementById(id);
const picker=$('picker'),exportBtn=$('export'),clearBtn=$('clear'),reverseBtn=$('reverse'),grid=$('grid'),empty=$('empty'),status=$('status'),prog=$('prog'),bar=$('bar'),title=$('title'),year=$('year'),titleView=$('titleView'),yearView=$('yearView');
let previews=[];
title.oninput=()=>titleView.textContent=title.value||' '; year.oninput=()=>yearView.textContent=year.value||' ';
const nextFrame=()=>new Promise(r=>requestAnimationFrame(()=>setTimeout(r,0)));
function updateStatus(f=0){status.innerHTML=`<span class="count">${previews.length}</span> photo${previews.length===1?'':'s'} in layout.${f?` ${f} skipped.`:''} Add more anytime.`}
async function makePreview(file,maxSide=1200){let source,temp=null;try{source=await createImageBitmap(file)}catch(e){temp=URL.createObjectURL(file);source=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=temp})}const w=source.width||source.naturalWidth,h=source.height||source.naturalHeight;if(!w||!h)throw new Error('Unsupported image');const s=Math.min(1,maxSide/Math.max(w,h)),cw=Math.round(w*s),ch=Math.round(h*s),c=document.createElement('canvas');c.width=cw;c.height=ch;const ctx=c.getContext('2d',{alpha:false});ctx.drawImage(source,0,0,cw,ch);if(source.close)source.close();if(temp)URL.revokeObjectURL(temp);const blob=await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('Preview failed')),'image/jpeg',.88));return{url:URL.createObjectURL(blob),width:cw,height:ch}}
picker.onchange=async()=>{const files=[...picker.files];picker.value='';if(!files.length)return;prog.style.display='block';let failed=0;for(let i=0;i<files.length;i++){status.textContent=`Adding ${i+1}/${files.length}…`;bar.style.width=`${Math.round(i/files.length*100)}%`;try{previews.push(await makePreview(files[i]));render()}catch(e){failed++}await nextFrame()}bar.style.width='100%';setTimeout(()=>prog.style.display='none',300);updateStatus(failed)};
reverseBtn.onclick=()=>{previews.reverse();render();updateStatus()};clearBtn.onclick=()=>{if(!confirm('Remove all photos from this layout?'))return;previews.forEach(p=>URL.revokeObjectURL(p.url));previews=[];render();status.textContent='All photos cleared.'};
function render(){grid.innerHTML='';const has=previews.length>0;grid.hidden=!has;empty.hidden=has;exportBtn.disabled=!has;clearBtn.disabled=!has;reverseBtn.disabled=!has;previews.forEach((p,idx)=>{const tile=document.createElement('div');tile.className='tile';const img=document.createElement('img');img.src=p.url;tile.appendChild(img);const controls=document.createElement('div');controls.className='controls';const del=document.createElement('button');del.className='iconbtn';del.textContent='×';del.onclick=()=>{URL.revokeObjectURL(previews[idx].url);previews.splice(idx,1);render();updateStatus()};controls.appendChild(del);tile.appendChild(controls);const move=document.createElement('div');move.className='movebar';const l=document.createElement('button');l.className='iconbtn';l.textContent='←';l.disabled=idx===0;l.onclick=()=>{[previews[idx-1],previews[idx]]=[previews[idx],previews[idx-1]];render()};const r=document.createElement('button');r.className='iconbtn';r.textContent='→';r.disabled=idx===previews.length-1;r.onclick=()=>{[previews[idx+1],previews[idx]]=[previews[idx],previews[idx+1]];render()};move.append(l,r);tile.appendChild(move);grid.appendChild(tile)})}
function loadImage(url){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url})}
function clipRound(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.closePath()}
function drawCover(ctx,img,x,y,w,h){const sw=img.naturalWidth,sh=img.naturalHeight,srcRatio=sw/sh,dstRatio=w/h;let sx=0,sy=0,sW=sw,sH=sh;if(srcRatio>dstRatio){sW=sh*dstRatio;sx=(sw-sW)/2}else{sH=sw/dstRatio;sy=(sh-sH)/2}ctx.drawImage(img,sx,sy,sW,sH,x,y,w,h)}
exportBtn.onclick=async()=>{if(!previews.length)return;exportBtn.disabled=true;exportBtn.textContent='Rendering…';prog.style.display='block';bar.style.width='5%';try{const W=1170,side=22,gap=9,colW=(W-side*2-gap*2)/3,cardH=colW*4/3,top=60,titleBlock=125,gridTop=top+titleBlock+20,radius=18,rows=Math.ceil(previews.length/3),H=Math.ceil(gridTop+rows*cardH+(rows-1)*gap+35);if(H>16000)throw new Error('too_tall');const c=document.createElement('canvas');c.width=W;c.height=H;const ctx=c.getContext('2d',{alpha:false});ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='700 52px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif';ctx.fillText(title.value||' ',W/2,top+42);ctx.fillStyle='#d5d5d5';ctx.font='500 39px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif';ctx.fillText(year.value||' ',W/2,top+91);for(let i=0;i<previews.length;i++){const col=i%3,row=Math.floor(i/3),x=side+col*(colW+gap),y=gridTop+row*(cardH+gap),img=await loadImage(previews[i].url);ctx.save();clipRound(ctx,x,y,colW,cardH,radius);ctx.clip();drawCover(ctx,img,x,y,colW,cardH);ctx.restore();bar.style.width=`${10+Math.round(i/previews.length*80)}%`;if(i%5===0)await nextFrame()}const blob=await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('PNG failed')),'image/png'));const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`${(title.value||'Memory').trim().replace(/[^\w-]+/g,'_')}_${(year.value||'').trim()}_classic.png`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000);updateStatus()}catch(e){alert(e.message==='too_tall'?'This layout is too tall for one iPhone image. Remove some photos or split it into sections.':'Export failed.')}finally{prog.style.display='none';bar.style.width='0%';exportBtn.disabled=false;exportBtn.textContent='Export PNG'}};
</script>
<script>if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}</script>
</body>
</html>
